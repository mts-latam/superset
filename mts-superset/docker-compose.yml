services:
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    ports:
      - 6379:6379
  db:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=admin
    restart: unless-stopped
    volumes:
      - db_home:/var/lib/postgresql/data
  superset-init:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    entrypoint: [ "/app/docker/docker-init.sh" ]

  superset:
    build: .
    ports:
      - 80:8088
    env_file:
      - .env
    depends_on:
      superset-init:
        condition: service_completed_successfully
volumes:
  redis_data:
  db_home:
